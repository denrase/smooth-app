appId: org.openfoodfacts.scanner
---
# Flow 2: Search Product
# Triggers: product.search, product.search.decode, HTTP spans
# Note: Pixel 4a in debug mode is VERY slow — search HTTP takes ~25-40s.
# Maestro cannot detect when results load because product card text is only
# in accessibilityText (not text). We submit the search and move on.
# Span validation is done via logcat + Sentry API.
# Prerequisite: flow 01 must run first (clearState).

- launchApp
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "maestro_search_bar"
    timeout: 45000
- takeScreenshot: 02_01_home

# Navigate to search
- tapOn: "maestro_search_bar"
- waitForAnimationToEnd

# Explicitly tap the search text field to ensure focus
- tapOn: "Search"
- waitForAnimationToEnd

# Type query and submit
- inputText: "nutella"
- waitForAnimationToEnd
- takeScreenshot: 02_02_typed_query
- pressKey: enter
- waitForAnimationToEnd
- takeScreenshot: 02_03_search_submitted

# Wait for search results to load (API is slow in debug mode: ~20-40s)
- runScript:
    file: scripts/wait_45s.js
- takeScreenshot: 02_04_search_results
