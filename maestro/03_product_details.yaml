appId: org.openfoodfacts.scanner
---
# Flow 3: Product Details via Deep Link
# Triggers: product.load span (ProductLoaderPage), TTID/TTFD, HTTP/SVG spans
# Expected spans: product.load with barcode attribute, SVG download spans
# Uses openLink to simulate a deep link, which routes through ProductLoaderPage

- launchApp
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "maestro_search_bar"
    timeout: 10000
- takeScreenshot: 03_01_home

# Open product via deep link (triggers ProductLoaderPage → product.load span)
- openLink: "https://world.openfoodfacts.org/product/3017620422003"
- waitForAnimationToEnd

# Wait for product page to load
- extendedWaitUntil:
    visible: "nutella"
    timeout: 15000
- takeScreenshot: 03_02_product_page

# Scroll product page to trigger more content loading
- scroll
- waitForAnimationToEnd
- takeScreenshot: 03_03_scrolled

# Go back to home
- back
- waitForAnimationToEnd
- takeScreenshot: 03_04_back
