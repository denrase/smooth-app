appId: org.openfoodfacts.scanner
---
# Flow 3: Product Details via Deep Link
# Triggers: product.load span, TTID/TTFD, HTTP/SVG spans
# Note: Pixel 4a is too slow for reliable Maestro text detection.
# We open the deep link and take a screenshot. Span validation via Sentry API.

- launchApp
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "maestro_search_bar"
    timeout: 45000
- takeScreenshot: 03_01_home

# Open product via deep link
- openLink: "https://world.openfoodfacts.org/product/3017620422003"
- waitForAnimationToEnd
- takeScreenshot: 03_02_deep_link_opened
