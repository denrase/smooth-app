appId: org.openfoodfacts.scanner
---
# Flow 4: Preferences
# Triggers: navigation spans, potential Hive read/write spans
# Tests that settings page interactions generate db spans
# Note: Pixel 4a in debug mode is VERY slow — generous timeouts needed.

- launchApp
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*"
    timeout: 45000
- takeScreenshot: 04_01_home

# Open settings/preferences via the Community tab
- tapOn: "Community"
- waitForAnimationToEnd
- takeScreenshot: 04_02_community

# Scroll through preferences
- scroll
- waitForAnimationToEnd
- takeScreenshot: 04_03_scrolled_1
- scroll
- waitForAnimationToEnd
- takeScreenshot: 04_04_scrolled_2

# Go back
- back
- waitForAnimationToEnd
- takeScreenshot: 04_05_back
