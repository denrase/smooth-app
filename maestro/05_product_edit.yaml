appId: org.openfoodfacts.scanner
---
# Flow 5: Product Edit
# Triggers: background_task.lifecycle, background_task.execute, Hive db spans
# Note: Pixel 4a is too slow for reliable Maestro text detection.
# We open product via deep link, wait for it to load, then tap edit.
# Span validation via Sentry API.

- launchApp
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "maestro_search_bar"
    timeout: 45000
- takeScreenshot: 05_01_home

# Open product via deep link (HTTP fetch takes a few seconds in debug mode)
- openLink: "https://world.openfoodfacts.org/product/3017620422003"
- waitForAnimationToEnd
- runScript:
    file: scripts/wait_15s.js
- takeScreenshot: 05_02_deep_link_opened
